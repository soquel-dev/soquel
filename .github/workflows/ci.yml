name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - .gitignore
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - docs/**
      - .gitignore
      - README.md
      - LICENSE

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  # gpui (zed) + gpui-component build deps: windowing, fonts, gl.
  # The exact set may need a tweak on the first CI run.
  GPUI_DEPS: libxkbcommon-x11-dev libwayland-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype6-dev libgbm-dev libssl-dev

jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `uses:` ignores working-directory, so point pnpm at landing's package.json.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: landing/package.json

      # Its own workspace and its own lockfile: the cache key cannot be the root one.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: landing/package.json
          cache: pnpm
          cache-dependency-path: landing/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  rust:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      # All three results, every run: one platform failing must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only Linux needs them: macOS (Metal) and Windows (DirectX) carry their own.
      - name: Install gpui system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GPUI_DEPS

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
          shared-key: soquel

      # Formatting has no platform to differ on, so it runs once.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Linux only: gpui's macOS/Windows test platforms don't back a real window,
      # so the view tests panic ("Test Windows are not backed by a real platform
      # window"). The suite is headless UI logic, so one platform covers it; clippy
      # above still compiles + lints the whole workspace on all three.
      # integration_* tests skip themselves without their SOQUEL_TEST_* env vars.
      - name: Test
        if: runner.os == 'Linux'
        run: cargo test --workspace

  integration_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gpui system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $GPUI_DEPS

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .
          shared-key: soquel

      # sshd StrictModes wants authorized_keys owned by root or the tunnel user (uid 1000);
      # the runner checkout is uid 1001.
      - name: Fix sshd mount ownership
        run: sudo chown root:root scripts/test-ssh/authorized_keys

      - name: Start test databases
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Integration tests
        run: bash scripts/test-integration.sh
