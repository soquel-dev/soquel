# Override for website screenshots: publishes the dev databases on their
# standard ports as well, so the market profiles show an endpoint nobody reads
# as a local sandbox. Compose concatenates `ports`, hence only the extra
# mapping here. Use with docker-compose.dev.yml (pnpm db:market).
services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432'

  mysql:
    ports:
      - '127.0.0.1:3306:3306'

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  mongo:
    ports:
      - '127.0.0.1:27017:27017'
