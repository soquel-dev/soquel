[package]
name = "soquel-app"
version = "0.1.0"
description = "Soquel: the gpui desktop app"
license = "FSL-1.1-MIT"
authors = ["Joris Gallot"]
edition = "2024"

# The core's Error is deliberately large (rich variants for the IPC boundary);
# the lint only fires on foreign error types, so core itself stays clean.
[lints.clippy]
result_large_err = "allow"

[dependencies]
anyhow = "1"
async-trait = "0.1"
fern = "0.7"
futures = "0.3"
humantime = "2"
log = "0.4"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "55968d167bd6959551c3417c3622899c33ecda20", features = ["tree-sitter-sql"] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "55968d167bd6959551c3417c3622899c33ecda20" }
lsp-types = { version = "0.97.0", features = ["proposed"] }
open = "5"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
rust-embed = "8"
soquel-core = { path = "../core" }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
