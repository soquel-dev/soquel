shellEmulator: true

# Own workspace root: the website keeps its own lockfile and its own CI job.
allowBuilds:
  esbuild: true
  # Astro's image pipeline; the page ships no raster images.
  sharp: false

trustPolicy: no-downgrade

# Same exclusions as the root workspace: these lost their provenance
# attestation upstream, not in a takeover.
trustPolicyExclude:
  - chokidar
packages: []
