[package]
name = "soquel"
version = "0.1.0"
description = "Desktop database client for Postgres, MySQL, SQLite, Redis and MongoDB"
license = "FSL-1.1-MIT"
authors = [ "Joris Gallot" ]
edition = "2021"
rust-version = "1.77.2"

# The core's Error is deliberately large (rich variants for the IPC boundary);
# the lint only fires on foreign error types, so core itself stays clean.
[lints.clippy]
result_large_err = "allow"

[lib]
name = "soquel_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
soquel-core = { path = "../crates/core" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = [ "derive" ] }
log = "0.4.33"
tauri = { version = "2.11.5", features = [ "specta" ] }
tauri-plugin-log = "2.9.0"
specta = { version = "=2.0.0-rc.25", features = [ "derive" ] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = [
  "derive",
  "typescript"
] }
thiserror = "2.0.19"
uuid = { version = "1", features = [ "v4" ] }
async-trait = "0.1.91"
futures-util = { version = "0.3.33", default-features = false }
tokio = { version = "1.53.1", features = [
  "sync",
  "net",
  "io-util",
  "process",
  "rt",
  "time"
] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-opener = "2.5.4"
time = { version = "0.3.55", features = [ "formatting" ] }
rmcp = { version = "3.0", features = [
  "server",
  "macros",
  "transport-streamable-http-server"
] }
axum = { version = "0.8.9", default-features = false, features = [
  "http1",
  "tokio"
] }
tokio-util = "0.7.19"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.27.0"
tokio-postgres = "0.7"
mongodb = { version = "3.8", default-features = false, features = [
  "rustls-tls",
  "compat-3-0-0"
] }
rusqlite = { version = "0.40.1", features = [
  "bundled",
  "column_decltype"
] }
tokio = { version = "1.53.1", features = [
  "rt",
  "rt-multi-thread",
  "macros",
  "time"
] }
