# Dev database: persistent, heavily seeded (pnpm db:dev:seed) to exercise the
# app with real volume. docker-compose.market.yml overrides the ports for
# landing screenshots (pnpm db:market).
name: soquel-dev

services:
  postgres:
    image: postgres:18.4-alpine
    ports:
      - '5470:5432'
    environment:
      POSTGRES_USER: soquel
      POSTGRES_PASSWORD: soquel
      POSTGRES_DB: soquel_dev
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soquel -d soquel_dev]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql:
    image: mysql:8.4
    ports:
      - '5471:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soquel_dev
      MYSQL_USER: soquel
      MYSQL_PASSWORD: soquel
    volumes:
      - mysqldata:/var/lib/mysql
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -usoquel -psoquel]
      interval: 2s
      timeout: 3s
      retries: 45

  redis:
    image: redis:7-alpine
    command: [redis-server, --requirepass, soquel, --appendonly, yes]
    ports:
      - '5472:6379'
    volumes:
      - redisdata:/data
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, redis-cli -a soquel ping | grep PONG]
      interval: 2s
      timeout: 3s
      retries: 15

  mongo:
    # 8.2 avoids the 8.0 startup guard that rejects Docker Desktop's Linux 6.19+ kernel.
    image: mongo:8.2
    ports:
      - '5473:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: soquel
      MONGO_INITDB_ROOT_PASSWORD: soquel
    volumes:
      - mongodata:/data/db
      - ./scripts/dev-seed:/seeds:ro
    healthcheck:
      test: [CMD-SHELL, mongosh --quiet -u soquel -p soquel --eval "db.adminCommand('ping').ok" | grep 1]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  mysqldata:
  redisdata:
  mongodata:
