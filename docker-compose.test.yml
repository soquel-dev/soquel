# Test databases, one service per connector kind, seeded from scripts/test-seeds/.
# Port plan: postgres 5455, mysql 5456, redis 5457, sshd tunnel target 5458, postgres-tls 5459,
# postgres-oldest 5460 (minimum supported major = oldest non-EOL; bump on postgres EOL dates),
# sshd-reconnect 5461, mysql-oldest 5462 (8.0: upstream EOL but dominant via RDS/Aurora),
# mariadb 5463 (LTS, same seed; TLS via scripts/test-tls so the ssl suite runs unchanged),
# mongo 5464.
name: soquel-test

services:
  postgres:
    image: postgres:18.4-alpine
    ports:
      - '5455:5432'
    environment:
      POSTGRES_USER: soquel
      POSTGRES_PASSWORD: soquel
      POSTGRES_DB: soquel_test
    volumes:
      - ./scripts/test-seeds/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    # Throwaway data: fresh seed on every up.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soquel -d soquel_test]
      interval: 2s
      timeout: 3s
      retries: 15

  # Oldest supported major, same seed: the whole integration suite runs against it too.
  postgres-oldest:
    image: postgres:14-alpine
    ports:
      - '5460:5432'
    environment:
      POSTGRES_USER: soquel
      POSTGRES_PASSWORD: soquel
      POSTGRES_DB: soquel_test
    volumes:
      - ./scripts/test-seeds/postgres.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soquel -d soquel_test]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql:
    image: mysql:8.4
    ports:
      - '5456:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soquel_test
      MYSQL_USER: soquel
      MYSQL_PASSWORD: soquel
    volumes:
      - ./scripts/test-seeds/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -usoquel -psoquel]
      interval: 2s
      timeout: 3s
      # First boot initializes the datadir: slower than postgres.
      retries: 45

  # Oldest supported mysql, same seed: the integration_mysql_* suite runs against it too.
  mysql-oldest:
    image: mysql:8.0
    ports:
      - '5462:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: soquel_test
      MYSQL_USER: soquel
      MYSQL_PASSWORD: soquel
    volumes:
      - ./scripts/test-seeds/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, mysqladmin ping -h 127.0.0.1 -usoquel -psoquel]
      interval: 2s
      timeout: 3s
      retries: 45

  # MariaDB rides the mysql kind: the integration_mysql_* suite runs against it too.
  mariadb:
    image: mariadb:11.4
    ports:
      - '5463:3306'
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: soquel_test
      MARIADB_USER: soquel
      MARIADB_PASSWORD: soquel
    volumes:
      - ./scripts/test-seeds/mysql.sql:/docker-entrypoint-initdb.d/seed.sql:ro
      - ./scripts/test-tls:/certs:ro
    # The key must be readable by the mysql user only: copy it out of the
    # read-only mount before handing off to the stock entrypoint.
    entrypoint: >
      sh -c "install -o mysql -g mysql -m 600 /certs/server.key /tmp/server.key
      && exec docker-entrypoint.sh mariadbd --ssl-cert=/certs/server.crt --ssl-key=/tmp/server.key"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, mariadb-admin ping -h 127.0.0.1 -usoquel -psoquel]
      interval: 2s
      timeout: 3s
      retries: 45

  # TLS-only handshake target (throwaway self-signed cert from scripts/test-tls/); no seed.
  postgres-tls:
    image: postgres:18.4-alpine
    ports:
      - '5459:5432'
    environment:
      POSTGRES_USER: soquel
      POSTGRES_PASSWORD: soquel
      POSTGRES_DB: soquel_test
    volumes:
      - ./scripts/test-tls:/certs:ro
    # Postgres refuses a key it does not own or that is world-readable: copy it out of the
    # read-only mount with 0600 before handing off to the stock entrypoint.
    entrypoint: >
      sh -c "install -o postgres -g postgres -m 600 /certs/server.key /tmp/server.key
      && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/tmp/server.key"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U soquel -d soquel_test]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    # Default user via requirepass + an ACL user for the username form field.
    command: [redis-server, --requirepass, soquel, --user, app, on, '>acl-pw', '~*', '+@all']
    ports:
      - '5457:6379'
    healthcheck:
      test: [CMD-SHELL, redis-cli -a soquel ping | grep PONG]
      interval: 2s
      timeout: 3s
      retries: 15

  mongo:
    # 8.2 avoids the 8.0 startup guard that rejects Docker Desktop's Linux 6.19+ kernel.
    image: mongo:8.2
    ports:
      - '5464:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: soquel
      MONGO_INITDB_ROOT_PASSWORD: soquel
    volumes:
      # Seeds soquel_e2e for the e2e spec; integration tests own soquel_test_*.
      - ./scripts/test-seeds/mongo.js:/docker-entrypoint-initdb.d/seed.js:ro
    # Throwaway data: fresh seed on every up.
    tmpfs:
      - /data/db
    healthcheck:
      test: [CMD-SHELL, mongosh --quiet -u soquel -p soquel --eval "db.adminCommand('ping').ok" | grep 1]
      interval: 2s
      timeout: 3s
      retries: 30

  # Bastion for tunnel tests: forwards to the postgres service over the compose network.
  # tunnel = key-only; tunnelpw = password auth (set by the entrypoint.d script).
  sshd:
    image: panubo/sshd:1.5.0
    ports:
      - '5458:22'
    environment:
      SSH_USERS: tunnel:1000:1000,tunnelpw:1001:1001
      SSH_ENABLE_PASSWORD_AUTH: 'true'
      TCP_FORWARDING: 'true'
    volumes:
      - ./scripts/test-ssh/authorized_keys:/etc/authorized_keys/tunnel:ro
      - ./scripts/test-ssh/set-password.sh:/etc/entrypoint.d/set-password.sh:ro
    healthcheck:
      test: [CMD-SHELL, nc -z 127.0.0.1 22]
      interval: 2s
      timeout: 3s
      retries: 15

  # Dedicated to the reconnect test, which restarts it mid-run: nothing else may use it.
  sshd-reconnect:
    image: panubo/sshd:1.5.0
    ports:
      - '5461:22'
    environment:
      SSH_USERS: tunnel:1000:1000
      TCP_FORWARDING: 'true'
    volumes:
      - ./scripts/test-ssh/authorized_keys:/etc/authorized_keys/tunnel:ro
    healthcheck:
      test: [CMD-SHELL, nc -z 127.0.0.1 22]
      interval: 2s
      timeout: 3s
      retries: 15
